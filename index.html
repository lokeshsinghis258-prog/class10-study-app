<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduSpark Class 10</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --purple:#6847e8;
  --pink:#ff5c9a;
  --blue:#20a9e8;
  --dark:#182033;
  --muted:#697386;
  --card:#ffffff;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--dark);
  min-height:100vh;
  background:
    radial-gradient(circle at 8% 8%,#d8f5ff 0,transparent 28%),
    radial-gradient(circle at 95% 12%,#ffe0ef 0,transparent 30%),
    radial-gradient(circle at 50% 100%,#e7e1ff 0,transparent 35%),
    #f7f9ff;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 6%;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(15px);
  box-shadow:0 5px 25px #0000000d;
}

.logo{
  font-size:24px;
  font-weight:900;
  color:var(--purple);
}

.logo span{
  color:var(--pink);
}

.class-badge{
  padding:9px 15px;
  border-radius:25px;
  background:#eeeaff;
  color:#5137c7;
  font-weight:bold;
}

/* HERO */

.hero{
  max-width:1200px;
  margin:auto;
  padding:55px 20px 35px;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:35px;
  align-items:center;
}

.hero h1{
  font-size:clamp(40px,6vw,70px);
  line-height:1.02;
}

.hero h1 span{
  color:var(--purple);
}

.hero-text{
  margin-top:20px;
  max-width:650px;
  color:var(--muted);
  font-size:18px;
  line-height:1.75;
}

.start-btn{
  margin-top:25px;
  border:0;
  padding:15px 25px;
  border-radius:30px;
  background:linear-gradient(135deg,var(--purple),#9c69ff);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 12px 30px #6847e844;
}

/* TEACHER */

.teacher-card{
  background:rgba(255,255,255,.92);
  border-radius:35px;
  padding:30px;
  text-align:center;
  box-shadow:0 20px 55px #40318b20;
}

.teacher-circle{
  width:190px;
  height:190px;
  margin:auto;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:100px;
  background:linear-gradient(135deg,#e8ddff,#d9f8ff);
  box-shadow:inset 0 0 30px #ffffff;
}

.teacher-card h2{
  margin-top:18px;
}

.teacher-card p{
  margin-top:7px;
  color:var(--muted);
}

.talk-btn{
  margin-top:18px;
  border:0;
  padding:13px 21px;
  border-radius:25px;
  background:#eeeaff;
  color:#5339ca;
  font-weight:bold;
  cursor:pointer;
}

/* SECTION */

.section{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

.section-title{
  font-size:30px;
  margin-bottom:22px;
}

/* SUBJECTS */

.subject-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:18px;
}

.subject{
  background:white;
  padding:25px;
  border-radius:25px;
  cursor:pointer;
  box-shadow:0 8px 28px #0000000d;
  transition:.25s;
}

.subject:hover{
  transform:translateY(-7px);
  box-shadow:0 15px 35px #00000016;
}

.subject-icon{
  font-size:45px;
  margin-bottom:14px;
}

.subject h3{
  font-size:19px;
}

.subject p{
  margin-top:7px;
  color:var(--muted);
  font-size:14px;
}

/* CHAPTERS */

#chapterSection,
#lessonSection{
  display:none;
}

.back{
  border:0;
  padding:11px 17px;
  border-radius:22px;
  background:#ece9ff;
  color:#5339ca;
  cursor:pointer;
  font-weight:bold;
  margin-bottom:20px;
}

.chapter-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:18px;
}

.chapter{
  background:white;
  border-radius:23px;
  padding:23px;
  cursor:pointer;
  box-shadow:0 8px 25px #0000000d;
  transition:.2s;
}

.chapter:hover{
  transform:translateY(-5px);
}

.chapter-number{
  font-size:13px;
  color:var(--purple);
  font-weight:bold;
}

.chapter h3{
  margin-top:9px;
}

.chapter p{
  margin-top:9px;
  color:var(--muted);
  line-height:1.5;
}

/* LESSON */

.lesson-card{
  background:white;
  padding:30px;
  border-radius:30px;
  box-shadow:0 12px 35px #00000010;
}

.lesson-title{
  color:#5d42d6;
  margin-bottom:22px;
}

.lesson-card h3{
  margin:22px 0 10px;
}

.explanation{
  padding:20px;
  border-radius:17px;
  line-height:1.8;
  color:#555f70;
  background:#f5f3ff;
  border-left:5px solid var(--purple);
}

.hindi-box{
  background:#fff4ea;
  border-left-color:#ff873e;
}

.action-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.action{
  border:0;
  padding:12px 17px;
  border-radius:22px;
  cursor:pointer;
  font-weight:bold;
}

.listen{
  background:#e5f8ff;
  color:#14627
