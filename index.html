<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 10 Study App</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f7ff;
  color:#172033;
}

header{
  background:#2563eb;
  color:white;
  text-align:center;
  padding:28px 15px;
}

header h1{
  font-size:30px;
  margin-bottom:8px;
}

header p{
  font-size:15px;
}

.container{
  max-width:950px;
  margin:auto;
  padding:20px;
}

.page-title{
  margin:10px 0 18px;
}

.subjects{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.subject{
  background:white;
  padding:22px 15px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.2s;
}

.subject:hover{
  transform:translateY(-3px);
}

.subject .icon{
  font-size:38px;
  margin-bottom:8px;
}

.subject h3{
  color:#2563eb;
}

.card{
  background:white;
  margin-top:20px;
  padding:20px;
  border-radius:16px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card h2{
  color:#2563eb;
  margin-bottom:12px;
}

.card h3{
  margin-bottom:10px;
}

.chapter{
  background:#eef4ff;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
}

.chapter:hover{
  background:#dbeafe;
}

.button{
  background:#2563eb;
  color:white;
  border:none;
  padding:12px 18px;
  border-radius:10px;
  margin-top:15px;
  cursor:pointer;
  font-size:15px;
}

.button:hover{
  background:#1d4ed8;
}

.back{
  background:#475569;
}

.info{
  background:#f8fafc;
  padding:14px;
  border-radius:10px;
  margin-top:10px;
  line-height:1.6;
}

.question{
  margin-top:15px;
  padding:18px;
  background:#f8fafc;
  border-radius:12px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  background:white;
  border:1px solid #d1d5db;
  padding:13px;
  margin:9px 0;
  border-radius:9px;
  cursor:pointer;
}

.option:hover{
  background:#e8f0ff;
}

.score{
  font-size:24px;
  font-weight:bold;
  margin:15px 0;
  color:#2563eb;
}

.progress{
  margin-top:10px;
  color:#64748b;
}

footer{
  text-align:center;
  padding:25px;
  margin-top:30px;
  background:#172554;
  color:white;
}

@media(max-width:600px){
  .subjects{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:25px;
  }
}
</style>
</head>

/* =========================
   FUNCTIONS
========================= */

function showSubject(subject){

let html=`
<h2>📚 ${subject}</h2>
<p>Select a chapter to start studying.</p>
`;

chapters[subject].forEach((chapter,index)=>{

html+=`
<div class="chapter"
onclick="showChapter('${subject}',${index})">
📖 Chapter ${index+1}: ${chapter}
</div>
`;

});

html+=`
<button class="button back" onclick="goHome()">
⬅ Back to Subjects
</button>
`;

document.getElementById("content").innerHTML=html;

}


function showChapter(subject,index){

const chapter=chapters[subject][index];

const summary=summaries[chapter] ||
"This chapter contains important concepts for Class 10 students. Read, revise and practise the important topics carefully.";

document.getElementById("content").innerHTML=`

<h2>📖 ${chapter}</h2>

<div class="card">

<h3>📝 Chapter Summary</h3>

<div class="info">
${summary}
</div>

</div>

<div class="card">

<h3>📌 Key Points</h3>

<div class="info">
• Understand the main concepts.<br>
• Learn important definitions and formulas.<br>
• Practise questions related to the chapter.<br>
• Revise the chapter before your examination.
</div>

</div>

<div class="card">

<h3>❓ Chapter Quiz</h3>

<p>Test your knowledge with a short quiz.</p>

<button class="button"
onclick="startQuiz('${subject}')">
Start Quiz
</button>

</div>

<button class="button back"
onclick="showSubject('${subject}')">
⬅ Back to Chapters
</button>
`;

}


let currentSubject="";
let currentQuestion=0;
let score=0;


function startQuiz(subject){

currentSubject=subject;
currentQuestion=0;
score=0;

showQuestion();

}


function showQuestion(){

const questions=quizBank[currentSubject];

if(currentQuestion>=questions.length){

showResult();
return;

}

const item=questions[currentQuestion];

let options="";

item.a.forEach((option,index)=>{

options+=`
<button class="option"
onclick="checkAnswer(${index})">
${option}
</button>
`;

});

document.getElementById("content").innerHTML=`

<h2>❓ ${currentSubject} Quiz</h2>

<div class="progress">
Question ${currentQuestion+1} of ${questions.length}
</div>

<div class="question">

<h3>${item.q}</h3>

${options}

<p id="answerResult"></p>

</div>

<button class="button back"
onclick="showSubject('${currentSubject}')">
⬅ Exit Quiz
</button>
`;

}


function checkAnswer(selected){

const item=quizBank[currentSubject][currentQuestion];

const result=document.getElementById("answerResult");

if(selected===item.c){

score++;

result.innerHTML="✅ Correct!";

}else{

result.innerHTML=
"❌ Incorrect. Correct answer: "+item.a[item.c];

}

setTimeout(()=>{

currentQuestion++;

showQuestion();

},900);

}


function showResult(){

document.getElementById("content").innerHTML=`

<h2>🏆 Quiz Complete!</h2>

<div class="card">

<div class="score">
Your Score: ${score} / ${quizBank[currentSubject].length}
</div>

<p>
${
score===quizBank[currentSubject].length
? "🎉 Excellent! You got all answers correct!"
: score>=2
? "👍 Good job! Keep practising."
: "📚 Keep studying and try the quiz again."
}
</p>

<button class="button"
onclick="startQuiz('${currentSubject}')">
🔄 Try Again
</button>

<button class="button back"
onclick="showSubject('${currentSubject}')">
⬅ Back to Chapters
</button>

</div>
`;

}


function goHome(){

document.getElementById("content").innerHTML=`

<h2>🎯 Start Learning</h2>

<p>Select any subject above to see its chapters.</p>

`;

}
